services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: fund_app
      POSTGRES_USER: fund_user
      POSTGRES_PASSWORD: fund_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://fund_user:fund_password@postgres:5432/fund_app
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  web:
    build:
      context: ./apps/web
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:

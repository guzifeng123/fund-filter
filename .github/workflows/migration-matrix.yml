name: Migration matrix

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrations:
    name: Alembic (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        database:
          - sqlite
          - postgresql
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_DB: fund_migration_ci
          POSTGRES_USER: fund_migration_admin
          POSTGRES_PASSWORD: migration_admin_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=fund_migration_admin --dbname=fund_migration_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install API and verification dependencies
        run: python -m pip install --disable-pip-version-check --editable "./apps/api[dev]"

      - name: Install pgvector and provision a non-owner migration role
        if: matrix.database == 'postgresql'
        run: >-
          docker exec "${{ job.services.postgres.id }}"
          psql --set ON_ERROR_STOP=on
          --username fund_migration_admin
          --dbname fund_migration_ci
          --command "CREATE EXTENSION IF NOT EXISTS vector;
          CREATE ROLE fund_migration_ci LOGIN PASSWORD 'migration_ci_only_password'
          NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          GRANT CONNECT ON DATABASE fund_migration_ci TO fund_migration_ci;
          GRANT USAGE, CREATE ON SCHEMA public TO fund_migration_ci;"

      - name: Verify SQLite migration lifecycle
        if: matrix.database == 'sqlite'
        run: python scripts/verify_migration_matrix.py --dialect sqlite

      - name: Verify PostgreSQL and pgvector migration lifecycle
        if: matrix.database == 'postgresql'
        env:
          DATABASE_URL: >-
            postgresql+psycopg://fund_migration_ci:migration_ci_only_password@127.0.0.1:5432/fund_migration_ci
        run: >-
          python scripts/verify_migration_matrix.py
          --dialect postgresql
          --database-url "$DATABASE_URL"
          --require-unprivileged-role
